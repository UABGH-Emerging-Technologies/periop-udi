name: Build and push periop-udi

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/docker-publish-main.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The build context is the REPOSITORY ROOT, not the Dockerfile's folder:
      # services/gudid-core/Dockerfile copies the fhir-bridge library modules
      # (COPY services/fhir-bridge/...), so a context scoped to the service
      # directory fails on that line.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/gudid-core/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/uabgh-emerging-technologies/periop-udi:latest
            ghcr.io/uabgh-emerging-technologies/periop-udi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
