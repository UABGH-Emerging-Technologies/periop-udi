name: Trigger auto deployment for preopudi

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/preopudi-AutoDeployTrigger-081a5dfe-870a-468f-a93e-39e0789d9043.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PREOPUDI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PREOPUDI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PREOPUDI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/services/gudid-core
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghrc.io
          registryUsername: ${{ secrets.PREOPUDI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PREOPUDI_REGISTRY_PASSWORD }}
          containerAppName: preopudi
          resourceGroup: anes-ai
          imageToBuild: ghrc.io/preopudi:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


