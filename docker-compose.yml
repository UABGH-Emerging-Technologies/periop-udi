# Public-beta composition: runs a single container (gudid-core) and uses the
# public SMART Health IT sandbox (https://launch.smarthealthit.org/v/r4/fhir)
# as its FHIR server. No local HAPI, no CDS Hooks, no Postgres.
services:
  # ---- GUDID core app (existing STA app; moved off 8080) ----
  # Built from the repo root so the image includes the fhir-bridge modules.
  gudid-core:
    build:
      context: .
      dockerfile: services/gudid-core/Dockerfile
    container_name: periop-udi-gudid-core
    ports:
      - "8090:8090"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      # No default: the app refuses to start on the built-in key when auth is on.
      - SECRET_KEY=${SECRET_KEY}
      - HOST_IP=${HOST_IP}
      - PORT=8090
      - FLASK_ENV=${FLASK_ENV:-production}
      - FHIR_BASE_URL=${FHIR_BASE_URL:-https://launch.smarthealthit.org/v/r4/fhir}
      - PUBLIC_FHIR_BASE_URL=${PUBLIC_FHIR_BASE_URL:-https://launch.smarthealthit.org/v/r4/fhir}
      # ---- Access gate ----
      - REQUIRE_AUTH=${REQUIRE_AUTH:-true}
      - DEMO_PASSCODE=${DEMO_PASSCODE}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      # ---- SMART App Launch v2 ----
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8090}
      - SMART_CLIENT_ID=${SMART_CLIENT_ID:-periop-udi}
      - SMART_DEFAULT_ISS=${SMART_DEFAULT_ISS:-https://launch.smarthealthit.org/v/r4/fhir}
    volumes:
      - ./services/gudid-core/static/qr_codes:/app/static/qr_codes
      - ./services/gudid-core/data:/app/data
      - ./eval/usage_logs:/app/eval/usage_logs
    restart: unless-stopped

  gudid-core-dev:
    build:
      context: .
      dockerfile: services/gudid-core/Dockerfile
    container_name: periop-udi-gudid-core-dev
    ports:
      - "8090:8090"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - HOST_IP=${HOST_IP}
      - PORT=8090
      - FLASK_ENV=development
      - FHIR_BASE_URL=${FHIR_BASE_URL:-https://launch.smarthealthit.org/v/r4/fhir}
      - PUBLIC_FHIR_BASE_URL=${PUBLIC_FHIR_BASE_URL:-https://launch.smarthealthit.org/v/r4/fhir}
      # ---- SMART App Launch v2 ----
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8090}
      - SMART_CLIENT_ID=${SMART_CLIENT_ID:-periop-udi}
      - SMART_DEFAULT_ISS=${SMART_DEFAULT_ISS:-https://launch.smarthealthit.org/v/r4/fhir}
    volumes:
      - ./services/gudid-core:/app
      - ./services/fhir-bridge/gudid_to_uscore_device.py:/app/gudid_to_uscore_device.py
      - ./services/fhir-bridge/hapi_client.py:/app/hapi_client.py
      - ./eval/usage_logs:/app/eval/usage_logs
    command: python app.py
    profiles:
      - dev
